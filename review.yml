actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No public API surface exists to model. apis[] is intentionally empty and
    the record is an honest identity-only stub with an aggregator-only data
    access note. No OpenAPI/Swagger was harvested because none is publicly
    downloadable.
